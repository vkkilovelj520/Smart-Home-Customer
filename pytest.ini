# pytest.ini - pytest 配置文件
# 类比：Maven 的 pom.xml 中 maven-surefire-plugin 的配置

[pytest]
# 测试文件在哪里
testpaths = tests

# 测试文件命名规则（默认就是 test_*.py 或 *_test.py）
python_files = test_*.py

# 测试函数/类的命名规则
python_functions = test_*
python_classes = Test*

# 测试报告显示详细信息
addopts = -v --tb=short

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
